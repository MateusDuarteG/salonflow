<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | SalonFlow</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="client-body">
    <header class="client-header">
        <a class="brand client-brand" href="/login">
            <span class="brand-mark">S</span>
            <span><strong>salonflow</strong><small>GESTÃO INTELIGENTE</small></span>
        </a>
        <span class="back-link"><a href="/login" style="color: inherit; text-decoration: none;">Já tem uma conta? Faça login</a></span>
    </header>

    <main class="booking-layout" style="max-width: 520px; display: block; margin-top: 45px; margin-bottom: 40px;">
        <section class="booking-card">
            <p class="eyebrow">NOVA EMPRESA</p>
            <h1 style="font: 700 27px Manrope; margin: 0 0 6px 0;">Criar sua conta</h1>
            <p class="subheading">Cadastre seu salão e isole seu ambiente de gestão.</p>

            <form id="register-form" style="display: grid; gap: 13px; margin-top: 24px;">
                <label class="date-label">Nome do Salão / Empresa
                    <input type="text" id="company_name" required placeholder="Ex: Studio Bella">
                </label>

                <label class="date-label">Identificador único (Slug)
                    <input type="text" id="company_slug" required placeholder="ex: studio-bella">
                </label>

                <label class="date-label">Seu Nome Completo
                    <input type="text" id="name" required placeholder="Seu Nome">
                </label>

                <label class="date-label">E-mail de Acesso
                    <input type="email" id="email" required placeholder="seu@email.com">
                </label>

                <label class="date-label">Senha
                    <input type="password" id="password" required placeholder="••••••••••••">
                </label>

                <p id="error-message" style="color: #a44; font-size: 11px; min-height: 14px; margin: 0;"></p>

                <button type="submit" class="primary-button" style="margin-top: 6px;">Cadastrar empresa →</button>
            </form>

            <p class="prototype-note" style="margin-top: 16px;">Ao cadastrar, sua empresa e a unidade matriz serão criadas automaticamente.</p>
        </section>
    </main>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = '';

            const payload = {
                company_name: document.getElementById('company_name').value,
                company_slug: document.getElementById('company_slug').value,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error || 'Erro ao registrar.';
                }
            } catch (err) {
                errorDiv.textContent = 'Erro de conexão com o servidor.';
            }
        });
    </script>
</body>
</html>
